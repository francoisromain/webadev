[package]
name = "webadev"
version = "0.1.1"
edition = "2024"
description = "A tiny dev web server with live reload"
license = "MIT"
repository = "https://github.com/francoisromain/webadev"
keywords = ["server", "live-reload", "web", "development", "watch"]
categories = ["development-tools"]
exclude = ["client/**", "sessions/**"]

[dependencies]
axum = { version = "0.8", default-features = false, features = [
    "tokio",
    "http1",
] }
clap = { version = "4", features = ["derive"] }
futures-util = "0"
mime_guess = "2"
notify = "8"
open = "5"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
http-body-util = "0"
tempfile = "3"
tower = { version = "0", features = ["util"] }
