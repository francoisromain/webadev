[package]
name = "dev_server"
version = "0.1.1"
edition = "2024"

[dependencies]
warp = { version = "0.4", features = ["websocket", "server"] }
tokio = { version = "1", features = ["full"] }
notify = "8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
