[package]
name = "webadev"
version = "0.10.0"
edition = "2024"
description = "A web dev server with live reload"
license = "MIT"
readme = "README.md"
repository = "https://github.com/francoisromain/webadev"
homepage = "https://github.com/francoisromain/webadev"
documentation = "https://docs.rs/webadev"
rust-version = "1.88"
keywords = ["server", "live-reload", "web", "development", "watch"]
categories = ["development-tools"]
exclude = ["client/**", "sessions/**", "docs/**"]

[features]
default = ["serve"]
serve = ["dep:axum", "dep:futures-util", "dep:mime_guess"]

[[bin]]
name = "webadev"
path = "src/main.rs"
required-features = ["serve"]

[dependencies]
axum = { version = "0.8", default-features = false, optional = true, features = [
    "tokio",
    "http1",
] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0", optional = true }
mime_guess = { version = "2", optional = true }
notify = "8"
open = "5"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
http-body-util = "0"
reqwest = "0.13"
tempfile = "3"
tower = { version = "0", features = ["util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "rustdoc::broken_intra_doc_links"]
