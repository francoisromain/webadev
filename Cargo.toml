[package]
name = "webadev"
version = "0.14.0"
edition = "2024"
description = "A web dev server with live reload"
license = "MIT"
readme = "README.md"
repository = "https://github.com/francoisromain/webadev"
documentation = "https://docs.rs/webadev"
rust-version = "1.91.1"
keywords = ["server", "live-reload", "web", "development", "watch"]
categories = ["development-tools"]
exclude = ["client/**", "sessions/**", "docs/**"]

[features]
default = ["cli"]
cli = [
    "watch",
    "serve",
    "dep:clap",
    "dep:open",
    "tokio/macros",
    "tokio/rt-multi-thread",
]
watch = ["dep:notify", "dep:tokio"]
serve = [
    "dep:axum",
    "dep:futures-util",
    "dep:mime_guess",
    "dep:tokio",
    "tokio/fs",
    "tokio/net",
]

[[bin]]
name = "webadev"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
axum = { version = "0.8", optional = true, default-features = false, features = [
    "tokio",
    "http1",
] }
clap = { version = "4", optional = true, features = ["derive"] }
futures-util = { version = "0", optional = true, default-features = false }
mime_guess = { version = "2", optional = true, default-features = false }
notify = { version = "9.0.0", optional = true }
open = { version = "5", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = [
    "sync",
] }

[dev-dependencies]
http-body-util = "0"
reqwest = { version = "0.13", default-features = false }
tempfile = "3"
tower = { version = "0", default-features = false, features = ["util"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "rustdoc::broken_intra_doc_links"]
